version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm run build -w packages/shared
    build:
      commands:
        - cd packages/web
        - npm run build
  artifacts:
    baseDirectory: packages/web/out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - packages/*/node_modules/**/*
      - packages/web/.next/cache/**/*
